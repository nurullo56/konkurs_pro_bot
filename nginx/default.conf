# ==============================================================================
# Avtomatik generatsiya qilingan Nginx konfiguratsiyasi
# Domen: smart-tools.uk
# Jami Webhook botlar: 0 ta
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name smart-tools.uk;

    # Let's Encrypt / Certbot tekshiruvlari uchun
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smart-tools.uk;

    # SSL sertifikat yo'llari (Certbot orqali o'rnatiladi)
    ssl_certificate /etc/letsencrypt/live/smart-tools.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smart-tools.uk/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Asosiy sahifa
    location / {
        return 200 "Konkurs Bot Pro Webhook Server is Running!\n";
        add_header Content-Type text/plain;
    }

}
