name: 🧪 CI — Test & Coverage

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Python ${{ matrix.python-version }} Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # ── 1. Kodni yuklash ──────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python o'rnatish ───────────────────────────────────────────────
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # ── 3. Kutubxonalar o'rnatish ─────────────────────────────────────────
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      # ── 4. Kod sintaksisini tekshirish ───────────────────────────────────
      - name: 🔍 Syntax check (ast.parse)
        run: |
          python -c "
          import ast, sys, pathlib
          errors = []
          for f in pathlib.Path('.').rglob('*.py'):
              if any(p in str(f) for p in ['__pycache__', '.venv', 'venv', 'htmlcov']):
                  continue
              try:
                  ast.parse(f.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('SYNTAX ERRORS:')
              print('\n'.join(errors))
              sys.exit(1)
          print(f'OK: Barcha fayllar sintaktik jihatdan togri')
          "

      # ── 5. Testlarni ishga tushirish + coverage ───────────────────────────
      - name: 🧪 Run tests with coverage
        env:
          BOT_TOKEN: "0000000000:FAKE_TOKEN_FOR_TESTING"
          ADMIN_IDS: "123456789"
          DB_TYPE: "sqlite"
          DB_PATH: ":memory:"
        run: |
          python -m pytest tests/ -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=40 \
            --tb=short

      # ── 6. Coverage hisobotini yuklab saqlash ─────────────────────────────
      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

      # ── 7. Codecov ga yuklash (ixtiyoriy) ────────────────────────────────
      - name: ☂️ Upload to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          verbose: false
